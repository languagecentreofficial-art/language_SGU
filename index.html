<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light only"><meta name="theme-color" content="#17306b"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><title>تسجيل الدخول</title></head><body><main><div class="card login"><h3>تسجيل الدخول</h3>
<label>الكود</label><input id="c" inputmode="numeric" autocomplete="username"><label>كلمة المرور</label><input id="p" type="password" autocomplete="current-password">
<button class="btn" id="go" style="width:100%">دخول</button><p class="msg" style="font-size:.85rem">كلمة المرور الأولى هي الكود الخاص بك، غيّرها بعد الدخول.</p></div></main>
<script src="assets/js/app.js?v=8"></script><script>shell(null);
const home={student:'student.html',lecturer:'lecturer.html',admin:'admin.html',assistant:'admin.html',affairs:'admin.html'};
if(me())location=home[me().role];
$('#go').onclick=async()=>{try{const u=await rpc('login',{p_code:$('#c').value.trim(),p_pass:$('#p').value});if(!u)return alert('الكود أو كلمة المرور غير صحيحة');localStorage.setItem('u',JSON.stringify(u));location=home[u.role]}catch(e){alert('تعذر الاتصال: '+e.message)}}</script></body></html>
