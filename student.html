<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light only"><meta name="theme-color" content="#17306b"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><title>الطالب</title></head><body><main><div id="v"></div></main>
<script src="assets/js/app.js?v=9"></script><script>
const u=guard(['student']);shell(u);const code=u.code;
const ALL=[
['بياناتي',async b=>{const [s]=await api('students?code=eq.'+code+'&select=code,name,phone,college,level,section,place');b.innerHTML=`<div class="card prof"><div class="av">${esc((s.name||"?")[0])}</div><h3>${esc(s.name)}</h3><div class="kv"><span>الكود</span><b>${s.code}</b><span>الكلية</span><b>${esc(s.college)||"-"}</b><span>المستوى</span><b>${esc(s.level)||"-"}</b><span>السكشن</span><b>${esc(s.section)||"-"}</b><span>المكان</span><b>${esc(s.place)||"-"}</b></div><p class="note">بياناتك الأكاديمية يحدّثها الأدمن. يمكنك تعديل رقم الهاتف وكلمة المرور فقط.</p><label>رقم الهاتف</label><input id="ph" value="${esc(s.phone)}"><button class="btn" id="sv">حفظ الهاتف</button></div>`;$('#sv').onclick=async()=>{await api('students?code=eq.'+code,'PATCH',{phone:$('#ph').value});alert('تم الحفظ')};changePassForm(b,u)}],
['جدولي',async b=>{const r=await api(`enrollments?student_code=eq.${code}&select=slot:slots(day,start_time,end_time,place,level,lecturer:staff(name))`);b.innerHTML='<div class="card wrap"><table class="table"><tr><th>اليوم</th><th>من</th><th>إلى</th><th>المكان</th><th>المحاضر</th><th>الليفل</th></tr>'+r.map(x=>x.slot).map(s=>`<tr><td>${s.day}</td><td>${fmt(s.start_time)}</td><td>${fmt(s.end_time)}</td><td>${esc(s.place)}</td><td>${esc(s.lecturer?.name)}</td><td>${esc(s.level)}</td></tr>`).join('')+'</table></div>'}],
['غيابي',async b=>{const a=await api(`attendance?student_code=eq.${code}&order=date`);const m={};a.forEach(x=>{const k=x.date.slice(0,7);m[k]=m[k]||{p:0,a:0};x.present?m[k].p++:m[k].a++});const P=a.filter(x=>x.present).length;const rl=Object.fromEntries((await api('rules')).map(r=>[r.key,r.value])),mk=new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'}).slice(0,7),pm=a.filter(x=>x.present&&x.date.startsWith(mk)).length;b.innerHTML=(pm<(rl.min_days_per_month??4)?`<div class="msg">⚠ حضرت ${pm} أيام هذا الشهر، والحد الأدنى ${rl.min_days_per_month??4}</div>`:'')+`<div class="card"><h3>إجمالي الترم</h3>حضور: <b class="ok">${P}</b> — غياب: <b class="bad">${a.length-P}</b></div><div class="card wrap"><h3>شهرياً</h3><table class="table"><tr><th>الشهر</th><th>حضور</th><th>غياب</th></tr>${Object.entries(m).map(([k,v])=>`<tr><td>${k}</td><td>${v.p}</td><td>${v.a}</td></tr>`).join('')}</table></div><div class="card wrap"><h3>سجل الأيام</h3><table class="table">${a.slice().reverse().map(x=>`<tr><td>${x.date}</td><td class="${x.present?'ok':'bad'}">${x.present?'حاضر':'غائب'}</td></tr>`).join('')}</table></div>`}],
['درجاتي',async b=>{const g=await api(`grades?student_code=eq.${code}&select=mark,exam:exams!inner(name,max_mark,published)&exam.published=eq.true`);if(!g.length){b.innerHTML='<div class="msg">لا توجد درجات منشورة حالياً.</div>';return}b.innerHTML='<div class="card wrap"><table class="table"><tr><th>التقييم</th><th>الدرجة</th><th>من</th></tr>'+g.map(x=>`<tr><td>${esc(x.exam.name)}</td><td>${x.mark??'-'}</td><td>${x.exam.max_mark}</td></tr>`).join('')+'</table></div>'}],
['شكوى',async b=>{const c=await api(`complaints?student_code=eq.${code}&order=id.desc`);b.innerHTML=`<div class="card"><h3>إرسال شكوى / تعارض</h3><textarea id="t" rows="3"></textarea><button class="btn" id="s">إرسال</button></div>`+c.map(x=>`<div class="card">${esc(x.body)}<br><span class="pill">${x.status=='open'?'قيد المراجعة':'تم الرد'}</span>${x.reply?'<div class="msg">الرد: '+esc(x.reply)+'</div>':''}</div>`).join('');$('#s').onclick=async()=>{if(!$('#t').value.trim())return;await api('complaints','POST',{student_code:code,body:$('#t').value},'return=minimal');const ad=await api('staff?role=in.(admin,assistant)&select=code');notify(ad.map(x=>x.code),'شكوى جديدة','من الطالب '+u.name);alert('تم الإرسال');b.innerHTML=''}}],
['طلب تغيير',async b=>{const s=await api('slots?select=id,day,start_time,end_time,place,level&order=day');const mine=await api('enrollments?student_code=eq.'+code+'&select=slot_id');const r=await api(`change_requests?student_code=eq.${code}&order=id.desc`);b.innerHTML=`<div class="card"><h3>طلب نقل إلى جروب آخر</h3><label>الجروب المطلوب</label><select id="to">${s.map(x=>`<option value="${x.id}">${x.day} ${fmt(x.start_time)}-${fmt(x.end_time)} | ${esc(x.place)} | ${esc(x.level)}</option>`).join('')}</select><label>السبب</label><textarea id="rs" rows="3"></textarea><button class="btn" id="s">إرسال الطلب</button></div>`+r.map(x=>`<div class="card">${esc(x.reason)}<br><span class="pill">${{pending:'قيد المراجعة',approved:'تمت الموافقة',rejected:'مرفوض'}[x.status]}</span>${x.reject_reason?'<div class="msg">سبب الرفض: '+esc(x.reject_reason)+'</div>':''}</div>`).join('');$('#s').onclick=async()=>{if(!$('#rs').value.trim())return alert('اكتب السبب');await api('change_requests','POST',{student_code:code,from_slot:mine[0]?.slot_id||null,to_slot:+$('#to').value,reason:$('#rs').value},'return=minimal');const ad=await api('staff?role=in.(admin,assistant)&select=code');notify(ad.map(x=>x.code),'طلب تغيير جروب','من الطالب '+u.name);alert('تم الإرسال');b.innerHTML=''}}],
['الإعلانات',async b=>{const a=await api('announcements?order=id.desc');b.innerHTML=a.map(x=>`<div class="card"><h3>${esc(x.title)}</h3>${esc(x.body)}<br><small>${x.created_at.slice(0,10)}</small></div>`).join('')||'لا توجد إعلانات'}]
];
(async()=>{let bl=[];try{bl=await api('blocks?student_code=eq.'+code+'&active=eq.true&select=reason')}catch(e){}
const lock=['جدولي','غيابي','طلب تغيير','درجاتي'];tabs(bl.length?ALL.filter(t=>!lock.includes(t[0])):ALL,$('#v'));
if(bl.length){const d=document.createElement('div');d.className='blockbar';d.innerHTML=ic('warn',26)+'<div><b>تم إيقاف متابعة الحضور وطلبات التغيير</b><span>السبب: '+esc(bl.map(x=>x.reason).join(' ، '))+'</span><span>يمكنك تقديم شكوى للتواصل مع شؤون الطلاب.</span></div>';document.querySelector('.home .hero').after(d)}})();
</script></body></html>
