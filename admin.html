 const setPw=async mode=>{if(u.role!='admin')return alert('للأدمن فقط');const c=$('#pc').value.trim(),a=$('#pa').value,n=mode=='code'?c:$('#pn').value;if(!c||!a||!n)return alert('أكمل الكود وكلمة مرور الأدمن'+(mode=='code'?'':' وكلمة المرور الجديدة'));if(mode!='code'&&n.length<6)return alert('كلمة المرور 6 أحرف على الأقل');
  try{const [s]=await api('students?code=eq.'+encodeURIComponent(c)+'&select=name'),[f]=await api('staff?code=eq.'+encodeURIComponent(c)+'&select=name'),nm=(s||f||{}).name;if(!nm)return alert('لا يوجد مستخدم بهذا الكود');if(!confirm((mode=='code'?'إعادة كلمة مرور ':'تغيير كلمة مرور ')+nm+' ('+c+')'+(mode=='code'?' إلى كوده؟':'؟')))return;

   alert({ok:'تم تغيير كلمة المرور',denied:'كلمة مرور الأدمن غير صحيحة أو لا تملك الصلاحية',notfound:'لا يوجد مستخدم بهذا الكود'}[r]||('نتيجة: '+r));if(r=='ok'){$('#pn').value='';$('#pa').value=''}}catch(e){alert('تعذر التنفيذ: '+e.message+'\nتأكد من تشغيل ملف admin_password.sql في Supabase')}};
