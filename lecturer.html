<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light only"><meta name="theme-color" content="#17306b"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css?v=49"><title>المحاضر</title></head><body><main><div id="v"></div></main>
<script src="assets/js/core.js?v=49"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="assets/js/content.js?v=49"></script><script src="assets/js/evals.js?v=49"></script><script>
const u=guard(['lecturer','admin','assistant']);shell(u);
tabs([
['تسجيل الغياب',async b=>{const today=new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'});
 b.innerHTML=`<div class="card"><label>اليوم</label><select id="d">${DAYS.map((d,i)=>`<option ${i==new Date().getDay()?'selected':''}>${d}</option>`).join('')}</select><label>الجروب</label><select id="g"></select></div><div id="l"></div>`;
 const loadG=async()=>{const s=await api(`slots?lecturer_code=eq.${u.code}&day=eq.${encodeURIComponent($('#d').value)}&order=start_time`);$('#g').innerHTML=s.map(x=>`<option value="${x.id}">${fmt(x.start_time)}-${fmt(x.end_time)} | ${esc(x.place)} | ${esc(x.level)}</option>`).join('')||'<option value="">لا توجد جروبات</option>';loadS()};
 const loadS=async()=>{const id=$('#g').value;if(!id){$('#l').innerHTML='';return}
  const en=await api(`enrollments?slot_id=eq.${id}&select=student:students(code,name)`);const at=en.length?await api(`attendance?date=eq.${today}&student_code=in.(${en.map(e=>encodeURIComponent(e.student.code)).join(',')})`):[];
  const on=new Set(at.filter(x=>x.present).map(x=>x.student_code));
  $('#l').innerHTML=en.map(e=>`<div class="stud ${on.has(e.student.code)?'p':''}" data-c="${e.student.code}"><span>${esc(e.student.name)}<br><small>${e.student.code}</small></span><span>${on.has(e.student.code)?'✔ حاضر':''}</span></div>`).join('')+'<button class="btn alt" id="sv" style="width:100%">تسجيل غياب سكشن اليوم</button><p class="msg">يمكنك تعديل سجل اليوم الحالي فقط. بعد انتهاء اليوم يعدّله الأدمن.</p>';
  document.querySelectorAll('.stud').forEach(d=>d.onclick=()=>{d.classList.toggle('p');d.lastChild.textContent=d.classList.contains('p')?'✔ حاضر':''});
  $('#sv').onclick=async()=>{const rows=[...document.querySelectorAll('.stud')].map(d=>({student_code:d.dataset.c,slot_id:+id,date:today,present:d.classList.contains('p'),marked_by:u.code}));await api('attendance?on_conflict=student_code,date','POST',rows,'resolution=merge-duplicates,return=minimal');alert('تم تسجيل الحضور، وغياب باقي الطلاب (حالة واحدة للطالب في اليوم، والحضور المسجل من جروب آخر يبقى كما هو)')}};
 $('#d').onchange=loadG;$('#g').onchange=loadS;loadG()}],
['التقييمات',b=>evalLecTab(b,u)],
['جدول محاضراتي',async b=>{const s=await api(`slots?lecturer_code=eq.${u.code}&order=start_time`);if(!s.length){b.innerHTML='<div class="msg">لا توجد جروبات مسندة إليك حتى الآن.</div>';return}
 const cap=g=>g.capacity||35,lb=g=>`${g.day} ${fmt(g.start_time)}-${fmt(g.end_time)} | كلاس ${esc(g.place)} | ${esc(g.level)}`,en=await api(`enrollments?slot_id=in.(${s.map(x=>x.id).join(',')})&select=slot_id`),N={};en.forEach(e=>N[e.slot_id]=(N[e.slot_id]||0)+1);
 const cnt=g=>`<span id="n${g.id}" ${(N[g.id]||0)>cap(g)?'class="bad"':''}>${N[g.id]||0}/${cap(g)} طالب</span>`;
 b.innerHTML=DAYS.filter(d=>s.some(x=>x.day==d)).map(d=>`<div class="dayh">${d}</div>`+s.filter(x=>x.day==d).map(x=>`<div class="srow" data-id="${x.id}"><b>كلاس ${esc(x.place)}</b><span><bdi dir="ltr">${fmt(x.start_time)} – ${fmt(x.end_time)}</bdi></span><span class="pill">الليفل ${esc(x.level)}</span>${cnt(x)}</div><div class="sbody" id="sb${x.id}" hidden></div>`).join('')).join('');
 const open=async id=>{const g=s.find(x=>x.id==id),a=await api(`enrollments?slot_id=eq.${id}&select=student:students(code,name,section)`),others=s.filter(x=>x.id!=id);N[id]=a.length;$('#n'+id).outerHTML=cnt(g);
  $('#sb'+id).innerHTML=`<div class="wrap"><table class="table"><tr><th>الاسم</th><th>الكود</th><th>السكشن</th><th>نقل إلى (جروباتك فقط)</th></tr>${a.map(({student:t})=>`<tr><td>${esc(t.name)}</td><td>${t.code}</td><td>${esc(t.section)}</td><td>${others.length?`<select data-m="${t.code}" data-s="${id}"><option value="">اختر جروباً...</option>${others.map(o=>`<option value="${o.id}">${lb(o)} (${N[o.id]||0}/${cap(o)})</option>`).join('')}</select>`:'—'}</td></tr>`).join('')||'<tr><td colspan="4">لا يوجد طلاب</td></tr>'}</table></div>`};
 b.querySelectorAll('.srow').forEach(r=>r.onclick=async()=>{const x=$('#sb'+r.dataset.id);x.hidden=!x.hidden;if(!x.hidden)await open(r.dataset.id)});
 b.onchange=async e=>{const t=e.target;if(t.dataset.m===undefined||!t.value)return;const from=+t.dataset.s,to=s.find(x=>x.id==t.value);if(!to||to.id==from)return;
  if((N[to.id]||0)>=cap(to)){alert('الكلاس المطلوب ممتلئ. تجاوز الحد الأقصى يكون من الأدمن فقط.');t.value='';return}
  if(!confirm('نقل الطالب '+t.dataset.m+' إلى '+to.day+' كلاس '+to.place+'؟')){t.value='';return}
  try{await api('enrollments?on_conflict=student_code,slot_id','POST',{student_code:t.dataset.m,slot_id:to.id},'resolution=merge-duplicates,return=minimal');await api(`enrollments?slot_id=eq.${from}&student_code=eq.${encodeURIComponent(t.dataset.m)}`,'DELETE');N[to.id]=(N[to.id]||0)+1;
   await notify([t.dataset.m],'تم نقلك',`${to.day} ${fmt(to.start_time)}-${fmt(to.end_time)} كلاس ${to.place}`);await open(from);if(!$('#sb'+to.id).hidden)await open(to.id);else $('#n'+to.id).outerHTML=cnt(to)}catch(x){alert(x.message);t.value=''}}}],
['طلبات التغيير',async b=>{const mine=await api(`slots?lecturer_code=eq.${u.code}&select=id,day,start_time,end_time,place,level,capacity`);if(!mine.length){b.innerHTML='<div class="msg">لا توجد جروبات مسندة إليك.</div>';return}
 const M=Object.fromEntries(mine.map(x=>[x.id,x])),ids=mine.map(x=>x.id).join(','),lb=g=>g?`${g.day} ${fmt(g.start_time)}-${fmt(g.end_time)} | كلاس ${esc(g.place)} | ${esc(g.level)}`:'-',cap=g=>g.capacity||35;
 const r=await api(`change_requests?status=eq.pending&to_slot=in.(${ids})&select=*,student:students(name,code,phone,level,section)&order=id`),fr=[...new Set(r.map(x=>x.from_slot).filter(Boolean))];
 const F=fr.length?Object.fromEntries((await api(`slots?id=in.(${fr.join(',')})&select=id,day,start_time,end_time,place,level,lec:staff(name)`)).map(x=>[x.id,x])):{},N={};(await api(`enrollments?slot_id=in.(${ids})&select=slot_id`)).forEach(e=>N[e.slot_id]=(N[e.slot_id]||0)+1);
 b.innerHTML=`<div class="card wrap"><h3>طلبات النقل إلى جروباتك (${r.length})</h3><button class="btn alt" id="aab">قبول المؤهلة تلقائياً (نفس الليفل والكلاس غير ممتلئ)</button><table class="table"><tr><th>الطالب</th><th>الكود</th><th>الجروب المطلوب</th><th>التاريخ</th></tr>${r.map(x=>`<tr class="clk" data-id="${x.id}"><td>${esc(x.student.name)}</td><td>${x.student.code}</td><td>${lb(M[x.to_slot])}</td><td>${x.created_at.slice(0,10)}</td></tr>`).join('')||'<tr><td colspan="4">لا توجد طلبات</td></tr>'}</table></div><div id="dt"></div>`;
 $('#aab').onclick=async()=>{const k=$('#aab');k.disabled=true;try{const R=await autoApprovePending(mine.map(x=>x.id));R.done.forEach(i=>{const tr=b.querySelector('.clk[data-id="'+i+'"]');if(tr)tr.remove()});$('#dt').innerHTML='';alert('تم قبول '+R.ok+' طلب تلقائياً، وبقي '+R.skip+' للمراجعة (ليفل مختلف أو جروب ممتلئ)')}catch(e){alert(e.message)}k.disabled=false};
 b.querySelectorAll('.clk').forEach(tr=>tr.onclick=()=>{b.querySelectorAll('.clk').forEach(t=>t.classList.remove('on'));tr.classList.add('on');const x=r.find(q=>q.id==tr.dataset.id),f=F[x.from_slot],to=M[x.to_slot];
  $('#dt').innerHTML=`<div class="card"><h3>${esc(x.student.name)} (${x.student.code}) - ${esc(x.student.phone)}</h3><p>${esc(x.student.level)} | ${esc(x.student.section)}</p><p><b>جروبه الحالي:</b> ${lb(f)}<br><b>محاضره الحالي:</b> ${esc(f?.lec?.name||'-')}</p><p><b>الجروب المطلوب (جروبك):</b> ${lb(to)} — <b>${N[to.id]||0}/${cap(to)} طالب</b></p><p><b>السبب:</b> ${esc(x.reason)}</p><input placeholder="سبب الرفض (عند الرفض)" id="rr"><button class="btn alt" id="ap">موافقة</button><button class="btn no" id="rj">رفض</button></div>`;
  const still=async()=>{const [c]=await api('change_requests?id=eq.'+x.id+'&select=status');if(!c||c.status!='pending'){alert('تم البت في هذا الطلب مسبقاً');return false}return true};
  $('#ap').onclick=async()=>{try{if((N[to.id]||0)>=cap(to))return alert('جروبك ممتلئ. تجاوز الحد الأقصى يكون من الأدمن فقط.');if(!confirm('الموافقة على نقل الطالب إلى '+to.day+' كلاس '+to.place+'؟'))return;
    if(!await still())return tabs.reload&&0;await api('enrollments?on_conflict=student_code,slot_id','POST',{student_code:x.student_code,slot_id:to.id},'resolution=merge-duplicates,return=minimal');
    if(x.from_slot&&x.from_slot!=to.id)await api(`enrollments?student_code=eq.${encodeURIComponent(x.student_code)}&slot_id=eq.${x.from_slot}`,'DELETE');
    await api('change_requests?id=eq.'+x.id,'PATCH',{status:'approved'});notify([x.student_code],'تمت الموافقة على طلبك','وافق المحاضر '+u.name+' على نقلك إلى '+to.day+' كلاس '+to.place);alert('تمت الموافقة');tr.remove();$('#dt').innerHTML=''}catch(e){alert(e.message)}};
  $('#rj').onclick=async()=>{const w=$('#rr').value.trim();if(!w)return alert('اكتب سبب الرفض');try{if(!await still())return;await api('change_requests?id=eq.'+x.id,'PATCH',{status:'rejected',reject_reason:w+' (المحاضر: '+u.name+')'});notify([x.student_code],'تم رفض طلبك',w);alert('تم الرفض');tr.remove();$('#dt').innerHTML=''}catch(e){alert(e.message)}}})}],
['المحتوى',b=>lecContentTab(b,u)],
['ملفي',async b=>{const [s]=await api('staff?code=eq.'+u.code+'&select=code,name,phone');b.innerHTML=`<div class="card"><h3>${esc(s.name)}</h3><label>رقم الهاتف</label><input id="ph" value="${esc(s.phone)}"><button class="btn" id="sv">حفظ</button></div>`;$('#sv').onclick=async()=>{await api('staff?code=eq.'+u.code,'PATCH',{phone:$('#ph').value});alert('تم')};changePassForm(b,u)}]
],$('#v'));
</script></body></html>
