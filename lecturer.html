<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light only"><meta name="theme-color" content="#17306b"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><title>المحاضر</title></head><body><main><div id="v"></div></main>
<script src="assets/js/app.js"></script><script>
const u=guard(['lecturer','admin','assistant']);shell(u);
tabs([
['تسجيل الغياب',async b=>{const today=new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'});
 b.innerHTML=`<div class="card"><label>اليوم</label><select id="d">${DAYS.map((d,i)=>`<option ${i==new Date().getDay()?'selected':''}>${d}</option>`).join('')}</select><label>الجروب</label><select id="g"></select></div><div id="l"></div>`;
 const loadG=async()=>{const s=await api(`slots?lecturer_code=eq.${u.code}&day=eq.${encodeURIComponent($('#d').value)}&order=start_time`);$('#g').innerHTML=s.map(x=>`<option value="${x.id}">${fmt(x.start_time)}-${fmt(x.end_time)} | ${esc(x.place)} | ${esc(x.level)}</option>`).join('')||'<option value="">لا توجد جروبات</option>';loadS()};
 const loadS=async()=>{const id=$('#g').value;if(!id){$('#l').innerHTML='';return}
  const [en,at]=await Promise.all([api(`enrollments?slot_id=eq.${id}&select=student:students(code,name)`),api(`attendance?slot_id=eq.${id}&date=eq.${today}`)]);
  const on=new Set(at.filter(x=>x.present).map(x=>x.student_code));
  $('#l').innerHTML=en.map(e=>`<div class="stud ${on.has(e.student.code)?'p':''}" data-c="${e.student.code}"><span>${esc(e.student.name)}<br><small>${e.student.code}</small></span><span>${on.has(e.student.code)?'✔ حاضر':''}</span></div>`).join('')+'<button class="btn alt" id="sv" style="width:100%">تسجيل غياب سكشن اليوم</button><p class="msg">يمكنك تعديل سجل اليوم الحالي فقط. بعد انتهاء اليوم يعدّله الأدمن.</p>';
  document.querySelectorAll('.stud').forEach(d=>d.onclick=()=>{d.classList.toggle('p');d.lastChild.textContent=d.classList.contains('p')?'✔ حاضر':''});
  $('#sv').onclick=async()=>{const rows=[...document.querySelectorAll('.stud')].map(d=>({student_code:d.dataset.c,slot_id:+id,date:today,present:d.classList.contains('p'),marked_by:u.code}));await api('attendance?on_conflict=student_code,slot_id,date','POST',rows,'resolution=merge-duplicates,return=minimal');alert('تم تسجيل الحضور، وغياب باقي الطلاب')}};
 $('#d').onchange=loadG;$('#g').onchange=loadS;loadG()}],
['ملفي',async b=>{const [s]=await api('staff?code=eq.'+u.code+'&select=code,name,phone');b.innerHTML=`<div class="card"><h3>${esc(s.name)}</h3><label>رقم الهاتف</label><input id="ph" value="${esc(s.phone)}"><button class="btn" id="sv">حفظ</button></div>`;$('#sv').onclick=async()=>{await api('staff?code=eq.'+u.code,'PATCH',{phone:$('#ph').value});alert('تم')};changePassForm(b,u)}]
],$('#v'));
</script></body></html>
